[project]
name = "rental-agent"
version = "0.1.0"
description = "Agent for a small rental-property LLC: rent research, expenses, leases, Gmail ingest"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "psycopg[binary]>=3.2",
    "google-api-python-client",
    "google-auth-oauthlib",
    "docxtpl",
    "openpyxl",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_agent"]

[tool.ruff]
line-length = 100
