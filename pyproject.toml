[project]
name = "rental-agent"
version = "0.1.0"
description = "Agent for a small rental-property LLC: rent research, expenses, leases, Gmail ingest"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "psycopg[binary]>=3.2",
    "google-api-python-client",
    "google-auth-oauthlib",
    "docxtpl",
    "openpyxl",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "cryptography>=50.0.2",
    "markdown>=3.11.3",
    "itsdangerous>=2.2.0",
    "pypdf>=7.1.0",
    "certifi",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_agent"]

[tool.ruff]
line-length = 100
