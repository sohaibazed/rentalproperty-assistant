# Start with `make up` (reads the key and password from your macOS Keychain).
services:
  rental-agent:
    build: .
    image: rental-agent:local
    container_name: rental-agent
    ports:
      - "127.0.0.1:8080:8080"          # this Mac only; not reachable from your network
    environment:
      RENTAL_SECRET_KEY_FILE: /run/secrets/rental_secret_key
      RENTAL_UI_PASSWORD_FILE: /run/secrets/rental_ui_password
      RENTAL_UI_USERNAME: ${RENTAL_UI_USERNAME:?run make up}   # login email, from Keychain
      RENTAL_PUBLIC_URL: https://localhost:8080
      TZ: America/Chicago              # Plano, TX: the scheduler's "today"
    secrets:
      - rental_secret_key
      - rental_ui_password
      - rental_tls_cert
      - rental_tls_key
    volumes:
      - rental-data:/data              # encrypted secrets file
      - ./artifacts:/app/artifacts     # reports, leases, receipts (shared with your Mac)
      - ./reference:/app/reference:ro
      - ./config:/app/config:ro        # email_sources.toml, models.toml
      - ./memory:/app/memory           # memory.md: your standing rules (editable on the Memory page)
      - ./prompts:/app/prompts         # agent-prompts.md (editable on the Prompts page)
    # Not read_only: Compose can only create secrets from environment variables when the
    # container filesystem is writable. The app runs as a non-root user that can't modify
    # its own code (root-owned) and only writes to /data, artifacts/, memory/ and prompts/.
    tmpfs:
      - /tmp
      - /home/agent
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Optional access from your own devices through Tailscale. `make up` starts this only when
  # a Tailscale auth key is in Keychain (`make init-tailscale`). It joins your tailnet as the
  # machine "rental-agent" and serves the app at https://rental-agent.<tailnet>.ts.net with a
  # real certificate. Only devices signed in to your tailnet can open it; nothing is public
  # (Funnel is off in config/tailscale/serve.json) and no port is published.
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: rental-agent-tailscale
    profiles: ["tailscale"]
    # Shares the app's network, so the app is 127.0.0.1:8080 from here.
    network_mode: service:rental-agent
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey   # a file, not the key itself
      TS_HOSTNAME: rental-agent
      TS_STATE_DIR: /var/lib/tailscale                  # keeps the machine's identity across restarts
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"                              # no kernel networking, so no extra privileges
    secrets:
      - tailscale_authkey
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    depends_on:
      rental-agent:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

secrets:
  tailscale_authkey:
    environment: TAILSCALE_AUTHKEY
  rental_secret_key:
    environment: RENTAL_SECRET_KEY
  rental_ui_password:
    environment: RENTAL_UI_PASSWORD
  # The self-signed HTTPS certificate and its private key. `make up` creates them once, in a
  # folder outside this repo, and passes the folder here.
  rental_tls_cert:
    file: ${RENTAL_TLS_DIR:?run make up}/cert.pem
  rental_tls_key:
    file: ${RENTAL_TLS_DIR:?run make up}/key.pem

volumes:
  rental-data:
  tailscale-state:
