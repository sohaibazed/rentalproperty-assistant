{% extends "base.html" %}
{% block title %}Runs · Rental Agent{% endblock %}
{% block content %}
<h1>Runs</h1>
{% include "_db_error.html" %}
<form method="get" action="/runs" class="inline">
  <select name="job" aria-label="Filter by job">
    <option value="">All jobs</option>
    {% for name in jobs %}<option value="{{ name }}" {% if job == name %}selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>
<section class="card">{% include "_runs_table.html" %}</section>
{% endblock %}
